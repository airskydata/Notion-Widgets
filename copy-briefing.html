<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 14px;
    background-color: #f1f1ef;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .content-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .text-line {
    color: #37352f;
    font-size: 14px;
    margin: 0;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .muted {
    font-size: 13px;
    color: #64645f;
  }
  .copy-btn {
    background-color: #ffffff;
    border: 1px solid #e2e2e2;
    color: #37352f;
    padding: 8px 12px;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
    align-self: flex-start;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .copy-btn:hover {
    background-color: #f7f7f5;
  }
</style>
</head>
<body>

<div class="content-box">
  <p class="text-line">Good morning</p>
  <p class="text-line">Today is <span id="currentDate" style="font-weight: 700;"></span></p>
  <p class="text-line muted">
    Please create a morning briefing for today using as a reference yesterday’s briefing located on Daily Briefings.
  </p>
</div>

<button class="copy-btn" id="copyBtn">Copy Text</button>

<script>
  // Date display
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const today = new Date().toLocaleDateString('en-US', options);
  document.getElementById('currentDate').innerText = today;

  // What gets copied
  const textToCopy =
`Good morning
Today is ${today}

Please create a morning briefing for today using as a reference yesterday’s briefing located on Daily Briefings.`;

  const btn = document.getElementById('copyBtn');

  async function copyText() {
    try {
      await navigator.clipboard.writeText(textToCopy);
      btn.innerText = "Copied!";
      btn.style.backgroundColor = "#eaf6ec";
      btn.style.color = "#2b6a3d";
      btn.style.borderColor = "#a3cfbb";
      setTimeout(() => {
        btn.innerText = "Copy Text";
        btn.style.backgroundColor = "#ffffff";
        btn.style.color = "#37352f";
        btn.style.borderColor = "#e2e2e2";
      }, 1500);
    } catch (e) {
      btn.innerText = "Copy failed";
      setTimeout(() => (btn.innerText = "Copy Text"), 1500);
    }
  }

  btn.addEventListener('click', copyText);
</script>

</body>
</html>
